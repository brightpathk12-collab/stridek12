<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRIDE Framework Visual</title>
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 20px; background: #F8FAFC; }
    .framework-ring { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 600px; margin: 0 auto; }
    .domain { width: 160px; text-align: center; padding: 24px 16px; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07); }
    .domain-letter { width: 48px; height: 48px; border-radius: 50%; background: #022C22; color: white; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
    .domain h3 { font-size: 14px; color: #2563EB; margin: 0; }
  </style>
</head>
<body>
  <div class="framework-ring">
    <div class="domain"><div class="domain-letter">S</div><h3>Sense</h3></div>
    <div class="domain"><div class="domain-letter">T</div><h3>Think</h3></div>
    <div class="domain"><div class="domain-letter">R</div><h3>Relate</h3></div>
    <div class="domain"><div class="domain-letter">I</div><h3>Innovate</h3></div>
    <div class="domain"><div class="domain-letter">D</div><h3>Decide</h3></div>
    <div class="domain"><div class="domain-letter">E</div><h3>Empower</h3></div>
  </div>
</body>
</html>
